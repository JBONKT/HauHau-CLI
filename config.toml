# Hauhau configuration.
# Edit freely; `hauhau /config` shows the effective values.

[model]
gguf = "/Users/johan/modeller/gguf/Gemma-4-E2B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf"
server_url = "http://127.0.0.1:8080"
manage_server = true
llama_server = "llama-server"
n_ctx = 8192
n_threads = 4
n_gpu_layers = 99
extra_args = []
startup_timeout = 120.0

[generation]
temperature = 0.7
top_p = 0.95
max_tokens = 1024
# Tools need room for a whole call; the model streams thinking tokens too.
tool_max_tokens = 512
# This build emits reasoning_content that can eat the entire budget. Off by
# default; raise max_tokens well above 500 before turning it on.
think = false

[agent]
name = "Hauhau"
max_steps = 12
context_budget_tokens = 5000
keep_recent_turns = 6
personality = """You are {name}, a CLI agent running locally on the user's machine. You have a
shell, a filesystem, and a persistent memory. Be direct and concrete: do the
work with tools instead of describing what you would do. Never claim a command
succeeded unless you ran it and saw the output. Prefer one decisive check over
several speculative ones. Keep replies short - the user is watching a terminal."""

[tools]
# false = auto-run everything (the project owner's choice). Set true to confirm.
shell_confirm = false
shell_timeout = 120.0
# Empty = everything is allowed. Entries are regexes matched against the command.
denylist = []
max_output_chars = 8000
workspace = "/Users/johan"

[brain]
enabled = true
top_k = 5
half_life_days = 30.0
dedupe_jaccard = 0.9
# Token-overlap containment: catches the same fact with an extra clause.
dedupe_containment = 0.8
inject_max_chars = 1500
# The generation model cannot embed. Point this at a second llama-server started
# with --embeddings to enable vector recall; empty means keyword-only (FTS5).
embeddings_url = ""
embeddings_model = "embeddinggemma-300m"
learn_after_turns = 0

[logging]
data_dir = "~/.hauhau"
audit = true
