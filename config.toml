[model]
gguf = "/Users/johan/modeller/gguf/Gemma-4-E2B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf"
server_url = "http://127.0.0.1:8080"
manage_server = true
llama_server = "llama-server"
# M1 Air 8 GB: profiler wants 8k ctx / 4 threads / full Metal.
# 16k + 3.2 GB weights was thrashing (heavy swap) and ~26 tok/s.
n_ctx = 8192
n_threads = 4
n_gpu_layers = 99
# Profiler for 3.2 GB model on 8 GB: stream weights + FA + single slot.
# Skip KV q8 (-ctk): measured ~half gen speed on this box.
extra_args = ["-lm", "none", "-fa", "on", "-np", "1"]
startup_timeout = 120.0

[generation]
temperature = 0.7
top_p = 0.95
max_tokens = 768
think = false

[agent]
name = "Hauhau"
max_steps = 10
# Must stay <= n_ctx/2 so /tune ctx_floor does not force 10k+ again.
context_budget_tokens = 4000
keep_recent_turns = 4
personality = """
You are {name}, a CLI agent running locally on the user's machine. You have a
shell, a filesystem, and a persistent memory. Be direct and concrete: do the
work with tools instead of describing what you would do. Never claim a command
succeeded unless you ran it and saw the output. Prefer one decisive check over
several speculative ones. Keep replies short - the user is watching a terminal."""
autonomy = true

[tools]
shell_confirm = false
shell_timeout = 120.0
denylist = []
max_output_chars = 4000
workspace = "/Users/johan"

[brain]
enabled = true
top_k = 5
half_life_days = 30.0
dedupe_jaccard = 0.9
dedupe_containment = 0.8
# Smaller inject = faster prompt on 8 GB; top_k still 5 for second-brain use.
inject_max_chars = 1200
embeddings_url = ""
embeddings_model = "embeddinggemma-300m"

# The journal: the record of what happened (mails, messages, calls, events,
# reminders). Separate from the memory brain - records never decay. Off = no
# journal database and no journal_* tools for the model.
# Reading iMessage/call history needs Full Disk Access for the Python
# interpreter; Mail/Calendar/Reminders need Automation permission (osascript).
[journal]
enabled = true
# path = ""            # empty = <data_dir>/journal/journal.db
mail_days = 7
calendar_days_back = 1
calendar_days_ahead = 14
messages_limit = 500
calls_limit = 300
brief_lookahead_days = 2
path = ""

# Agent skills (SKILL.md folders, the open Agent Skills convention). Only the
# name and description of each skill sit in the prompt; the model loads the
# body on demand with the skill tool. Scanned in order: dirs below, then
# <data_dir>/skills, then the built-ins shipped with hauhau - first name wins,
# so a copy in ~/.hauhau/skills overrides a built-in.
[skills]
enabled = true
dirs = []
# dirs = ["~/projects/my-skills"]

[logging]
data_dir = "~/.hauhau"
audit = true
